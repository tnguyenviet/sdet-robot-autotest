name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_tags:
        description: 'Test tags to include (e.g., smoke, e2e)'
        required: false
        default: ''
      browser:
        description: 'Browser to use'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

env:
  PYTHON_VERSION: '3.11'
  BROWSER: chrome
  HEADLESS: 'true'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy
      
      - name: Check code formatting with Black
        run: black --check libraries/
      
      - name: Lint with flake8
        run: flake8 libraries/ --max-line-length=100 --ignore=E501,W503

  test:
    name: Run Robot Framework Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify Chrome installation
        run: |
          google-chrome --version
          chromedriver --version
      
      - name: Create reports directory
        run: mkdir -p reports allure-results
      
      - name: Run Robot Framework Tests
        id: robot_tests
        continue-on-error: true
        run: |
          robot \
            --outputdir reports \
            --listener allure_robotframework \
            --variable BROWSER:${{ env.BROWSER }} \
            --variable HEADLESS:${{ env.HEADLESS }} \
            --pythonpath . \
            --pythonpath libraries \
            --loglevel INFO \
            ${{ github.event.inputs.test_tags && format('--include {0}', github.event.inputs.test_tags) || '' }} \
            tests/
      
      - name: Upload Robot Framework Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-reports
          path: reports/
          retention-days: 30
      
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
      
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
      
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
      
      - name: Check test results
        if: steps.robot_tests.outcome == 'failure'
        run: exit 1

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Smoke Tests
        run: |
          robot \
            --outputdir reports \
            --include smoke \
            --variable BROWSER:chrome \
            --variable HEADLESS:true \
            --pythonpath . \
            --pythonpath libraries \
            tests/
      
      - name: Upload Smoke Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-reports
          path: reports/
          retention-days: 7

  scheduled-regression:
    name: Scheduled Regression Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
      
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run All Tests
        run: |
          robot \
            --outputdir reports \
            --listener allure_robotframework \
            --variable BROWSER:chrome \
            --variable HEADLESS:true \
            --pythonpath . \
            --pythonpath libraries \
            tests/
      
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports
          path: reports/
